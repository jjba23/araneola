variables:
  - &byggsteg_image "docker.io/jjba23/byggsteg-woodpecker:v0.3.0"
  - &jointhefreeworld_byggsteg_url "https://byggsteg.jointhefreeworld.org"

clone:
  - name: "⬇️ Clone Git repository"
    image: woodpeckerci/plugin-git
    settings:
      depth: 1

steps:
  get-byggsteg-token:
    name: "🔒 Get token @ Byggsteg"
    image: *byggsteg_image
    when:
      - event: [push]
    settings:
      BYGGSTEG_STEP: get-token
      BYGGSTEG_EMAIL:
        from_secret: BYGGSTEG_EMAIL
      BYGGSTEG_PASSWORD:
        from_secret: BYGGSTEG_PASSWORD
      BYGGSTEG_URL: *jointhefreeworld_byggsteg_url

  submit-byggsteg-job:
    name: "💼 Submit job @ Byggsteg"
    image: *byggsteg_image
    when:
      - event: [push]
    settings:
      BYGGSTEG_STEP: submit-job
      BYGGSTEG_URL: *jointhefreeworld_byggsteg_url
      BYGGSTEG_JOB_CODE: |
        (lambda()
          `((task . "maak-deploy")
            (project . "%%CI_REPO_NAME%%")
            (branch-name . "%%CI_COMMIT_BRANCH%%")
            (clone-url . "%%CI_REPO_CLONE_URL%%")))

  poll-byggsteg-job:
    name: "🔄 Poll job status @ Byggsteg"
    image: *byggsteg_image
    when:
      - event: [push]
    settings:
      BYGGSTEG_STEP: poll-job
      BYGGSTEG_URL: *jointhefreeworld_byggsteg_url
